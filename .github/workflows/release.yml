name: Release

# Push a tag like v0.1.0 (or v0.2.0-beta.1 for a pre-release) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }

      - name: Test
        run: dotnet test -c Release

      - name: Package
        shell: powershell
        run: .\build\package.ps1 -Version "${{ github.ref_name }}"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" artifacts/FormRelay-*-win-x64.zip artifacts/FormRelay-*-win-x64.zip.sha256 \
            --title "FormRelay $TAG" --notes-file .github/release-notes.md --generate-notes $flags
