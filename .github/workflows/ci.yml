name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: test-results, path: "**/results.trx" }

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Installer script parses
        shell: powershell
        run: |
          $errs = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\installer\FormRelay-Setup.ps1", [ref]$tokens, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Error "$($_.Message) (line $($_.Extent.StartLineNumber))" }; exit 1 }
      - name: Install-Files regression tests
        shell: powershell
        run: |
          .\tests\installer\Install-Files.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launcher parses and reaches the installer
        # cmd parses a whole parenthesized block before running it, so a stray ")" in an echo line breaks the launcher
        # even when that block would not run. The runner is already elevated, so this takes the "admin" path.
        shell: powershell
        run: |
          $out = (cmd /c 'installer\FormRelay-Setup.cmd check < nul 2>&1') | Out-String
          $out
          if ($out -match 'was unexpected') { throw 'FormRelay-Setup.cmd has a syntax error' }
          if ($out -notmatch 'FormRelay check') { throw 'FormRelay-Setup.cmd did not reach the installer' }
          exit 0   # the launcher's own exit code (2: nothing installed on a CI runner) is expected
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = @('installer', 'build') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Check mode runs on a machine with no install
        shell: powershell
        run: |
          .\installer\FormRelay-Setup.ps1 check
          if ($LASTEXITCODE -ne 2) { Write-Error "expected exit code 2 (nothing installed), got $LASTEXITCODE"; exit 1 }
          exit 0
  migrations:
    # Every numbered migration must run cleanly, in order, twice in a row, against a real SQL Server.
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Ci-Passw0rd!x" }
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Passw0rd!x' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations and samples twice
        run: |
          cid=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -1)
          docker cp db "$cid:/tmp/db"
          sql() { docker exec "$cid" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Passw0rd!x' -b "$@"; }
          sql -Q "CREATE DATABASE FormRelay"
          for pass in 1 2; do
            for f in db/0*.sql db/samples/*.sql; do
              echo "pass $pass: $f"
              sql -d FormRelay -i "/tmp/$f"
            done
          done
